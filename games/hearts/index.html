<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f58">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hearts">
    <title>Hearts - Basic Build</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css?v=20260804-base-1">
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div><h1>Hearts</h1><p>Local Hearts · follow suit, broken hearts, scoring, and computer players</p></div>
        <div class="actions"><span id="status" class="status" aria-live="polite"></span><label><input id="computer-mode" type="checkbox" checked> Play against computer</label><label>Players <select id="player-count"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select></label><a class="button-link" href="../../index.html">Main Menu</a><button id="new-game" type="button">New Deal</button></div>
      </header>
      <section class="scorebar" id="scorebar"></section>
      <section class="panel"><div class="panel-heading"><h2>Current trick</h2><button id="finish-trick" type="button" disabled>Collect trick</button></div><div id="trick" class="trick"></div><p id="note" class="note">The player with the 2♣ leads. Follow suit, avoid points on the first trick, and keep hearts unbroken until necessary.</p></section>
      <section id="pass-panel" class="panel pass-panel" hidden><strong id="pass-title"></strong><button id="show-hand" type="button">Show this player's cards</button></section>
      <section class="panel"><div class="panel-heading"><h2>Hands</h2><span>Player 1 is human when computer mode is on.</span></div><div id="hands" class="players"></div></section>
    </main>
    <script src="app.js?v=20260809-distinct-1"></script>
  </body>
</html>
