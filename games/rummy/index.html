<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f58">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Rummy">
    <title>Rummy - Basic Build</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css?v=20260804-base-1">
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div><h1>Rummy</h1><p>Local rummy · melds, turns, and a basic computer opponent</p></div>
        <div class="actions"><span id="status" class="status" aria-live="polite"></span><label><input id="computer-mode" type="checkbox" checked> Play against computer</label><a class="button-link" href="../../index.html">Main Menu</a><button id="new-game" type="button">New Deal</button></div>
      </header>
      <section class="scorebar"><div><span>Player 1</span><strong id="count-1">10 cards</strong></div><div><span>Stock</span><strong id="stock-count">0</strong></div><div><span>Discard</span><strong id="discard-top">—</strong></div><div><span>Player 2</span><strong id="count-2">10 cards</strong></div></section>
      <section class="panel actions-panel"><button id="draw-card" type="button">Draw from stock</button><button id="draw-discard" type="button">Draw discard</button><button id="discard-card" type="button" disabled>Discard selected</button><span id="turn-note" class="note">Draw one card, then select a card and discard it.</span></section>
      <section class="panel"><div class="panel-heading"><h2>Hands</h2><span>Pass the device between turns.</span></div><div id="hands" class="players"></div></section>
    </main>
    <script src="app.js?v=20260808-rules-1"></script>
  </body>
</html>
